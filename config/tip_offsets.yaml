version: 1

# Per-(head, tip box) Tips On / Tips Off geometry overrides.
#
# Resolved at Tips On / Tips Off time by matching the active head_type and the
# tip box labware. A row matches when its head_type matches AND either its
# `tipbox` (labware name, case/whitespace-insensitive) or `tipbox_id`
# (labware_type_id) matches. Rows are scanned top-to-bottom; the first match wins.
#
# Any field left unset on a matching row — or the absence of any matching row —
# falls back to the profile's safety.* values (tips_off_z_offset /
# tips_off_w_position) and the global TIPBOX_JOG_TOLERANCE (5.0 mm) for the
# Tips On press window. So a tip box with no entry here keeps behaving exactly as
# it did before (profile defaults).
#
# Fields (head_type + one of tipbox/tipbox_id are required; the rest optional):
#   tips_off_z_offset     mm the head ejects ABOVE the seated press depth. Longer
#                         tips (LT200) need a larger value (~25); short tips
#                         (ST10) need less or they end up too far from the box.
#   tips_off_w_position   W/uL target the plunger drives to when knocking tips
#                         off, before returning W to 0. Tune empirically.
#   tips_on_jog_tolerance mm accept window for the Tips On force press. Widen this
#                         when a deeper-engaging tip trips a false "Unable to
#                         reach destination on Z within tolerance" (default 5.0).
#   tips_on_z_offset      mm added to the Tips On press target (+ = press deeper).
#                         Usually 0; a fine-tune for press depth.

offsets:
  # 96-channel LT (200 uL) head with the long V11 LT200 tips. These tips engage
  # ~7-8 mm shallower than the ST10-tuned press target, which tripped the false
  # "within tolerance" warning, so the accept window is widened. They also stand
  # much taller out of the box, so Tips Off must eject ~25 mm above the seated
  # depth (vs the profile default of 15).
  #
  # tips_off_w_position: the W ejector hits a HARD MECHANICAL STOP at -11 on this
  # head — driving to -11 (or beyond) stalls the W servo and aborts the move with
  # "RESERVED event ERROR from node 5.1" even though the tips strip off. -9 clears
  # the stop and ejects cleanly. Do NOT round this toward -10/-11.
  - head_type: HT_96_D_200
    tipbox: 96 V11 LT200 Tip Box 06880.002
    tipbox_id: lw-b0704e550d2a
    tips_off_z_offset: 25.0
    tips_off_w_position: -9.0
    tips_on_jog_tolerance: 12.0
    tips_on_z_offset: 0.0

  # 384-channel ST (70 uL) head with the short V11 ST10 tips — the combination
  # used until now. Seeded from the working SRT_BRAVO.yaml safety values; the
  # short tips never tripped the Tips On warning, so the press window stays at
  # the 5 mm default. A small eject offset keeps the short tips close to the box.
  - head_type: HT_384_D_70
    tipbox: 384 V11 ST10 Tip Box 10734.102
    tipbox_id: lw-4914769d0af7
    tips_off_z_offset: 14.0
    tips_off_w_position: -7.0
    tips_on_jog_tolerance: 5.0
    tips_on_z_offset: 0.0

  # ---------------------------------------------------------------------------
  # Template — copy and edit per (head, tip box) you run. A tip box with no row
  # here keeps using the profile's safety.* defaults, so add one only to override.
