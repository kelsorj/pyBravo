# Composable planning patterns, not executable or hardware-qualified methods.
version: 1
recipes:
  - id: stacked_384_diluent_and_sample
    version: 1.0.0
    status: synthetic_pattern
    title: Diluent and sample additions to stacked 384-well plates
    triggers: ["stack", "384", "diluent", "sample"]
    trigger_match: all
    intent: >-
      Keep separate diluent and sample sources and one material for every
      destination plate. Ask for the plate count if absent. Propose an input
      stack, a free working position and a separate output stack. Process
      destinations top-first: destack to the work position (move the final
      singleton), add diluent, add sample, then move to an empty output position
      or stack on completed plates. Preserve each source's requested volume as
      a distinct transfer. Ask whether additions cover the full head footprint.
      Reusing tips is a separate scientist decision; a same-tip request never
      combines two 5 uL transfers into a 10 uL aspiration. Starting volume,
      physical rack inventory, liquid classes and pipetting heights stay unknown
      until supplied or reviewed. No plate count or catalog ID is established
      by this recipe.
    operations: [destack_plate, move_plate, transfer, stack_plate]
    source_path: docs/agent-planning.md
    review_points: [destination_count_and_stack_order, full_head_scope, source_identity, physical_tip_inventory, starting_and_dead_volumes, liquid_methods, carryover_policy, working_and_output_positions]
  - id: four_384_to_1536_quadrants
    version: 1.0.0
    status: synthetic_pattern
    title: Four 384-well sources into 1536-well quadrants
    triggers: ["384", "1536", "quadrant"]
    trigger_match: all
    intent: >-
      Keep four sources stacked in one deck position, four source-dedicated ST10
      racks, and two destinations distinct. Stage each top source in a work position,
      then move it to a processed stack. Propose source 1/A1, 2/A2, 3/B1, 4/B2
      on each destination, subject to source-identity and stack-order confirmation.
      Match named Labcyte PP/LDV plates to verified catalog geometry but confirm
      physical plates and rack inventory. Each source well supplies 5 uL to each destination:
      require at least 10 uL usable per well plus dead volume and method overage. A tip
      set may be reused across initially empty destination wells only under a reviewed
      contamination policy; nominal ST10 capacity alone does not justify one 10 uL
      aspiration for two dispenses. Prefer separate aspirations until a qualified
      method establishes effective capacity including residual and air gap.
    operations: [destack_plate, transfer, stack_plate]
    source_path: docs/bravo-capability-manifest.md
    review_points: [source_identity_and_stack_order, source_to_rack_to_quadrant_mapping, physical_tip_inventory, source_well_usable_and_dead_volume, per_source_tip_reuse_policy, shared_aspiration_effective_capacity, catalog_plate_identity, loaded_deck_confirmation]
  - id: serial_dilution
    version: 1.0.0
    status: synthetic_pattern
    title: Serial dilution across a plate
    triggers: ["serial dilution", "dilute"]
    trigger_match: any
    intent: Preserve dilution factors, source carryover policy, mixing, and ordered transfers.
    operations: [transfer, mix]
    source_path: examples/protocols/benchmark.json
    review_points: [dilution_factor, per_well_volume, mixing_method, tip_reuse]
  - id: distribute_to_destinations
    version: 1.0.0
    status: synthetic_pattern
    title: One source aliquoted into several destinations
    triggers: ["distribute", "aliquot", "dispense into"]
    trigger_match: any
    intent: Keep a single aspiration and each ordered dispense distinct when effective tip capacity permits.
    operations: [distribute]
    source_path: docs/bravo-method-knowledge.md
    review_points: [total_aspirate_volume, air_gap, residual_volume, contamination]
